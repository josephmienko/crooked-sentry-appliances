# Home Assistant Secrets Template
# 
# This file should be saved as secrets.yaml in your HA config directory
# Copy from this template and fill in YOUR actual values
# 
# Home Assistant will automatically read secrets.yaml and substitute !secret references
# in configuration files (e.g., "password: !secret mqtt_password" -> actual password value)
#
# IMPORTANT: Do NOT commit secrets.yaml to git.
# Add to .gitignore: secrets.yaml

# MQTT Broker Credentials (if using external MQTT)
mqtt_user: homeassistant
mqtt_password: your_secure_mqtt_password_here

# Frigate Integration
frigate_api_url: http://192.168.1.20:5000

# Local Admin Account (created during HA onboarding)
ha_admin_username: your_ha_username
ha_admin_password: your_ha_password

# (Optional) Latitude/Longitude for sun position and automations
latitude: 35.0
longitude: -85.0
elevation: 400

# (Optional) Additional services added later
# Example placeholders for future phases:
# api_key_service1: your_key_here
# api_key_service2: your_key_here

# Keep this file secure:
# chmod 600 ~/.homeassistant/secrets.yaml  (Linux/macOS)
# or ensure file permissions restrict read access to your user only
